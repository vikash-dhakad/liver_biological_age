services:
  - type: web
    name: liver-biological-age-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "cd liver_django && gunicorn liver_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_MYSQL
        value: "False"
